name: g8pay-agente
region: nyc

services:
  - name: web
    github:
      repo: mktdigital-rsn/g8pay-agente
      branch: main
      deploy_on_push: true
    environment_slug: node-js
    instance_count: 1
    instance_size_slug: basic-xxs
    http_port: 3000
    run_command: npm start
    health_check:
      http_path: /api/health
      port: 3000
      initial_delay_seconds: 20
      period_seconds: 10
      timeout_seconds: 5
      failure_threshold: 5
    envs:
      - key: NODE_ENV
        scope: RUN_AND_BUILD_TIME
        type: GENERAL
        value: production
