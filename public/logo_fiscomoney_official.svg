<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 120" width="450" height="120">
  <g transform="translate(10, 10)">
    <!-- Gold Circle Emblem with Pillars and Upward Arrow -->
    <g transform="translate(0, 0)">
      <!-- Outer Circle / Arc -->
      <circle cx="50" cy="50" r="42" fill="none" stroke="#cca43b" stroke-width="4" opacity="0.4" />
      <path d="M 50 8 A 42 42 0 0 1 92 50" fill="none" stroke="#cca43b" stroke-width="5" stroke-linecap="round" />
      
      <!-- Pillars (Bar Chart) inside -->
      <rect x="28" y="55" width="8" height="20" rx="1.5" fill="#cca43b" />
      <rect x="40" y="42" width="8" height="33" rx="1.5" fill="#cca43b" />
      <rect x="52" y="30" width="8" height="45" rx="1.5" fill="#cca43b" />
      <rect x="64" y="22" width="8" height="53" rx="1.5" fill="#cca43b" />
      
      <!-- Upward / Wrapping Arrow -->
      <path d="M 18 70 C 22 85, 45 92, 65 85 C 80 80, 88 65, 88 50 C 88 38, 82 25, 74 18" fill="none" stroke="#cca43b" stroke-width="4.5" stroke-linecap="round" />
      <!-- Arrow Head -->
      <path d="M 68 18 L 78 14 L 78 26 Z" fill="#cca43b" />
    </g>

    <!-- FiscoMoney Soluções Tributárias Text -->
    <g transform="translate(115, 10)">
      <!-- FiscoMoney Text -->
      <text x="0" y="44" font-family="'Inter', 'Montserrat', 'Outfit', sans-serif" font-size="36" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
        Fisco<tspan fill="#cca43b">Money</tspan>
      </text>
      <!-- Soluções Tributárias Subtitle -->
      <text x="2" y="70" font-family="'Inter', 'Montserrat', 'Outfit', sans-serif" font-size="12" font-weight="900" fill="#cca43b" letter-spacing="4.5" opacity="0.9">
        SOLUÇÕES TRIBUTÁRIAS
      </text>
    </g>
  </g>
</svg>
