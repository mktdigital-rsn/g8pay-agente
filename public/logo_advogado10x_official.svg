<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 100" width="100%" height="100%">
  <!-- Icon Mark: Modern Premium Scale & 10x Geometric Mark -->
  <g transform="translate(10, 10)">
    <!-- Central golden pillar of justice (forms the 1 in 10X) -->
    <rect x="24" y="10" width="14" height="60" rx="4" fill="#cca43b" />
    
    <!-- Golden balance scale bar (forms the diagonal of 10X / high speed growth) -->
    <path d="M 10,24 C 10,24 24,14 31,14 C 38,14 52,24 52,24" fill="none" stroke="#cca43b" stroke-width="6" stroke-linecap="round" />
    
    <!-- Left golden balance dish -->
    <circle cx="10" cy="38" r="8" fill="#cca43b" opacity="0.85" />
    <!-- Right golden balance dish -->
    <circle cx="52" cy="38" r="8" fill="#cca43b" opacity="0.85" />
    
    <!-- The "X" overlay in gold, indicating 10X scaling results -->
    <path d="M 40,42 L 58,60 M 58,42 L 40,60" stroke="#cca43b" stroke-width="7" stroke-linecap="round" />
  </g>

  <!-- Typography -->
  <!-- "Advogado" in clean bold white -->
  <text x="95" y="65" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="44" fill="#ffffff" letter-spacing="-0.02em">Advogado</text>
  <!-- "10x" in premium gold -->
  <text x="315" y="65" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="44" fill="#cca43b" letter-spacing="-0.02em">10x</text>
  
  <!-- Subtle Tagline (Gestão / Marketing Jurídico) -->
  <text x="98" y="85" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="10" fill="#cca43b" letter-spacing="0.4em" opacity="0.8">ECOSSISTEMA JURÍDICO</text>
</svg>
